<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download IraChat - IraChat</title>
    <style>
        :root {
            --bg-dark: #10121d;
            --card-dark: #1b1e2e;
            --text-light: #f8f8f2;
            --text-muted: #9ca3af;
            --accent-purple: #c084fc;
            --gradient-button: linear-gradient(135deg, #c084fc 0%, #a855f7 100%);
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background-color: var(--card-dark);
            border: 1px solid rgba(192, 132, 252, 0.3);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        h1 { font-size: 2.5rem; margin-top: 0; }
        .accent { color: var(--accent-purple); }
        p { color: var(--text-muted); margin-bottom: 30px; }
        .button {
            display: inline-block;
            background: var(--gradient-button);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }
        .back-link { display: block; margin-top: 25px; color: var(--accent-purple); text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Get <span class="accent">IraChat</span></h1>
        <p>Ready to experience private, offline-capable AI on your device? Download the latest release below.</p>
        <a href="#" class="button" id="real-download-btn">📥 Download for Android (.apk)</a>
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script>
        const dlBtn = document.getElementById('real-download-btn');
        dlBtn.addEventListener('click', (e) => {
            e.preventDefault();
            dlBtn.innerHTML = "⏳ Preparing download...";
            setTimeout(() => {
                dlBtn.innerHTML = "✅ Download Started!";
                dlBtn.style.background = "#10b981";
            }, 1500);
        });
    </script>
</body>
</html>
